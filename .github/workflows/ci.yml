name: LOOM Citadel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
      - name: Install pinned Component Model oracles
        run: |
          mkdir -p .component-tools/wasm-tools .component-tools/wasmtime
          curl -fsSL -o .component-tools/wasm-tools.tar.gz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.257.1/wasm-tools-1.257.1-x86_64-linux.tar.gz
          echo "acea0a6f71b15f3b2d394f97453398f29099cec52df93bb25741a22561639b24  .component-tools/wasm-tools.tar.gz" | sha256sum -c -
          tar -xzf .component-tools/wasm-tools.tar.gz -C .component-tools/wasm-tools
          curl -fsSL -o .component-tools/wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.0/wasmtime-v48.0.0-x86_64-linux.tar.xz
          echo "1d23a692da51a4f825698f3f999da71f28bad19a96df5395fadc8d07f162dac3  .component-tools/wasmtime.tar.xz" | sha256sum -c -
          tar -xJf .component-tools/wasmtime.tar.xz -C .component-tools/wasmtime
          echo "ff4dcf239ce09315e531394c63c7f0e2cbe9856dfbbd1f5b2b4d267b4f09df95  .component-tools/wasm-tools/wasm-tools-1.257.1-x86_64-linux/wasm-tools" | sha256sum -c -
          echo "4fcabfd0e346761d32f250d4ce55706acef526495aaefb1eb8e6afe3bb0890c5  .component-tools/wasmtime/wasmtime-v48.0.0-x86_64-linux/wasmtime" | sha256sum -c -
          cargo build --locked --release --manifest-path tools/loom-component-builder/Cargo.toml
          cargo build --locked --release --manifest-path tools/loom-effectful-component-builder/Cargo.toml
          echo "LOOM_WASM_TOOLS=${GITHUB_WORKSPACE}/.component-tools/wasm-tools/wasm-tools-1.257.1-x86_64-linux/wasm-tools" >> "$GITHUB_ENV"
          echo "LOOM_WASMTIME=${GITHUB_WORKSPACE}/.component-tools/wasmtime/wasmtime-v48.0.0-x86_64-linux/wasmtime" >> "$GITHUB_ENV"
          echo "LOOM_COMPONENT_BUILDER=${GITHUB_WORKSPACE}/tools/loom-component-builder/target/release/loom-component-builder" >> "$GITHUB_ENV"
          echo "LOOM_EFFECTFUL_COMPONENT_BUILDER=${GITHUB_WORKSPACE}/tools/loom-effectful-component-builder/target/release/loom-effectful-component-builder" >> "$GITHUB_ENV"
          echo "LOOM_CARGO=$(rustup which --toolchain 1.93.0 cargo)" >> "$GITHUB_ENV"
          echo "LOOM_RUSTC=$(rustup which --toolchain 1.93.0 rustc)" >> "$GITHUB_ENV"
          echo "LOOM_COMPONENT_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "LOOM_FEDERATION_WITNESS_OUT=${GITHUB_WORKSPACE}/.federation-witness/x86_64-unknown-linux-gnu.json" >> "$GITHUB_ENV"
          echo "LOOM_GENERAL_EXECUTION_WITNESS_OUT=${GITHUB_WORKSPACE}/.general-execution-witness/x86_64-unknown-linux-gnu.json" >> "$GITHUB_ENV"
          echo "LOOM_GENERAL_EXECUTION_RUNNER=ubuntu-latest" >> "$GITHUB_ENV"
      - name: Install package build tooling
        run: python -m pip install "setuptools>=61" wheel
      - name: Compile Python sources
        run: python -m py_compile loom.py loom_parse.py loom_checker.py loom_bounds.py loom_frontend.py loom_recursion.py loom_runtime.py loom_cli.py loom_gate.py loom_observer.py loom_evidence.py loom_approval.py loom_codegen.py loom_wasm.py loom_component.py loom_wasi_capabilities.py loom_component_adapter.py loom_effectful_execution.py loom_effectful_host.py loom_effectful_result.py loom_effectful_attestation.py loom_execution_bundle.py loom_component_release.py loom_provenance.py loom_windows_execution.py loom_windows_general.py loom_general_federation.py verify_docs_parity.py docs/loom.py run_tests.py fuzz_tests.py tools/verify_component_federation_ci.py tools/verify_general_execution_federation_ci.py
      - name: Run citadel
        run: python run_tests.py
      - name: Upload Linux Component witness
        uses: actions/upload-artifact@v4
        with:
          name: component-platform-linux
          path: .federation-witness/x86_64-unknown-linux-gnu.json
          if-no-files-found: error
      - name: Upload Linux General Execution witness
        uses: actions/upload-artifact@v4
        with:
          name: general-execution-platform-linux
          path: .general-execution-witness/x86_64-unknown-linux-gnu.json
          if-no-files-found: error
      - name: Verify published docs parity
        run: python verify_docs_parity.py
      - name: Run extended deterministic fuzz seeds
        run: |
          python fuzz_tests.py --cases 256 --seed 0xC17ADE1
          python fuzz_tests.py --cases 256 --seed 0xBADC0DE
          python fuzz_tests.py --cases 256 --seed 0xA11CE

  verify-macos-component:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
      - name: Install pinned macOS Component Model oracles
        run: |
          mkdir -p .component-tools/wasm-tools .component-tools/wasmtime
          curl -fsSL -o .component-tools/wasm-tools.tar.gz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.257.1/wasm-tools-1.257.1-aarch64-macos.tar.gz
          echo "1d1ced29aa8320733a7e27452434e66f9bcb61ce39a00ee63229594d71f8544d  .component-tools/wasm-tools.tar.gz" | shasum -a 256 -c -
          tar -xzf .component-tools/wasm-tools.tar.gz -C .component-tools/wasm-tools
          curl -fsSL -o .component-tools/wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.0/wasmtime-v48.0.0-aarch64-macos.tar.xz
          echo "b62f687c7b19dd7c04b44ba5d6170a92a2c99bfc190887348aee9323e3703e60  .component-tools/wasmtime.tar.xz" | shasum -a 256 -c -
          tar -xJf .component-tools/wasmtime.tar.xz -C .component-tools/wasmtime
          echo "0caa33cff1a81fd1acd0a20a6cd955411c9932350ebbbe32ebae70708483e752  .component-tools/wasm-tools/wasm-tools-1.257.1-aarch64-macos/wasm-tools" | shasum -a 256 -c -
          echo "1b9185f271806517d7f838b7f9446ee870feb0b22ee9a104e4af334b8c52ccdd  .component-tools/wasmtime/wasmtime-v48.0.0-aarch64-macos/wasmtime" | shasum -a 256 -c -
          cargo build --locked --release --manifest-path tools/loom-component-builder/Cargo.toml
          cargo build --locked --release --manifest-path tools/loom-effectful-component-builder/Cargo.toml
          echo "LOOM_WASM_TOOLS=${GITHUB_WORKSPACE}/.component-tools/wasm-tools/wasm-tools-1.257.1-aarch64-macos/wasm-tools" >> "$GITHUB_ENV"
          echo "LOOM_WASMTIME=${GITHUB_WORKSPACE}/.component-tools/wasmtime/wasmtime-v48.0.0-aarch64-macos/wasmtime" >> "$GITHUB_ENV"
          echo "LOOM_COMPONENT_BUILDER=${GITHUB_WORKSPACE}/tools/loom-component-builder/target/release/loom-component-builder" >> "$GITHUB_ENV"
          echo "LOOM_EFFECTFUL_COMPONENT_BUILDER=${GITHUB_WORKSPACE}/tools/loom-effectful-component-builder/target/release/loom-effectful-component-builder" >> "$GITHUB_ENV"
          echo "LOOM_CARGO=$(rustup which --toolchain 1.93.0 cargo)" >> "$GITHUB_ENV"
          echo "LOOM_RUSTC=$(rustup which --toolchain 1.93.0 rustc)" >> "$GITHUB_ENV"
          echo "LOOM_COMPONENT_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "LOOM_FEDERATION_WITNESS_OUT=${GITHUB_WORKSPACE}/.federation-witness/aarch64-apple-darwin.json" >> "$GITHUB_ENV"
          echo "LOOM_GENERAL_EXECUTION_WITNESS_OUT=${GITHUB_WORKSPACE}/.general-execution-witness/aarch64-apple-darwin.json" >> "$GITHUB_ENV"
          echo "LOOM_GENERAL_EXECUTION_RUNNER=macos-14" >> "$GITHUB_ENV"
      - name: Install package build tooling
        run: python -m pip install "setuptools>=61" wheel
      - name: Compile federation surfaces
        run: python -m py_compile loom.py loom_wasi_capabilities.py loom_component_adapter.py loom_effectful_execution.py loom_effectful_host.py loom_effectful_result.py loom_effectful_attestation.py loom_execution_bundle.py loom_component_release.py loom_windows_execution.py loom_windows_general.py loom_general_federation.py run_tests.py tools/verify_component_federation_ci.py tools/verify_general_execution_federation_ci.py
      - name: Run macOS Component citadel
        run: python run_tests.py
      - name: Upload macOS Component witness
        uses: actions/upload-artifact@v4
        with:
          name: component-platform-macos
          path: .federation-witness/aarch64-apple-darwin.json
          if-no-files-found: error
      - name: Upload macOS General Execution witness
        uses: actions/upload-artifact@v4
        with:
          name: general-execution-platform-macos
          path: .general-execution-witness/aarch64-apple-darwin.json
          if-no-files-found: error

  verify-windows-core:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and install the Windows wheel
        shell: pwsh
        run: |
          python -m pip install "setuptools>=61" wheel
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/loom-wheel" | Out-Null
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$env:RUNNER_TEMP/loom-wheel"
          $wheels = @(Get-ChildItem "$env:RUNNER_TEMP/loom-wheel/*.whl")
          if ($wheels.Count -ne 1) { throw "expected exactly one LOOM wheel" }
          python -m pip install --force-reinstall $wheels[0].FullName
      - name: Compile portable core sources
        run: python -m py_compile loom.py loom_parse.py loom_checker.py loom_bounds.py loom_frontend.py loom_recursion.py loom_runtime.py loom_codegen.py loom_wasm.py loom_cli.py fuzz_tests.py tools/windows_core_conformance.py
      - name: Run Windows Core Conformance v0
        env:
          LOOM_WINDOWS_RUNNER: windows-2025
        run: python tools/windows_core_conformance.py --output .windows-core-witness/x86_64-pc-windows-msvc.json
      - name: Upload Windows Core witness
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-conformance-v0
          path: .windows-core-witness/x86_64-pc-windows-msvc.json
          if-no-files-found: error

  verify-windows-component:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned Windows Component Model oracles
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".component-tools"
          $wasmToolsRoot = Join-Path $root "wasm-tools"
          $wasmtimeRoot = Join-Path $root "wasmtime"
          New-Item -ItemType Directory -Force -Path $wasmToolsRoot, $wasmtimeRoot | Out-Null
          $wasmToolsZip = Join-Path $root "wasm-tools.zip"
          $wasmtimeZip = Join-Path $root "wasmtime.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.257.1/wasm-tools-1.257.1-x86_64-windows.zip" -OutFile $wasmToolsZip
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.0/wasmtime-v48.0.0-x86_64-windows.zip" -OutFile $wasmtimeZip
          if ((Get-FileHash -Algorithm SHA256 $wasmToolsZip).Hash.ToLowerInvariant() -ne "6d9bc36132f25a063dfb5e18bb8a025c7f8b8b01f139eb976a32081cad1c6137") { throw "wasm-tools archive hash mismatch" }
          if ((Get-FileHash -Algorithm SHA256 $wasmtimeZip).Hash.ToLowerInvariant() -ne "d6cc742660e9edf35c92b47179808802f01eca3bf60ab4b0ac723c167592131f") { throw "Wasmtime archive hash mismatch" }
          Expand-Archive -Path $wasmToolsZip -DestinationPath $wasmToolsRoot
          Expand-Archive -Path $wasmtimeZip -DestinationPath $wasmtimeRoot
          $wasmTools = @(Get-ChildItem -Path $wasmToolsRoot -Recurse -File -Filter "wasm-tools.exe")
          $wasmtime = @(Get-ChildItem -Path $wasmtimeRoot -Recurse -File -Filter "wasmtime.exe")
          if ($wasmTools.Count -ne 1 -or $wasmtime.Count -ne 1) { throw "expected exactly one pinned executable per archive" }
          if ((Get-FileHash -Algorithm SHA256 $wasmTools[0].FullName).Hash.ToLowerInvariant() -ne "51698e3975100f5ee65a72e998eb958fd254e3bed99b9ba2ac3ac0025088a4b8") { throw "wasm-tools executable hash mismatch" }
          if ((Get-FileHash -Algorithm SHA256 $wasmtime[0].FullName).Hash.ToLowerInvariant() -ne "cadcc7480082a372256d6dae7b2855aca3d74edbfa844838b4a33076e5ec40b8") { throw "Wasmtime executable hash mismatch" }
          cargo build --locked --release --manifest-path tools/loom-component-builder/Cargo.toml
          cargo build --locked --release --manifest-path tools/loom-effectful-component-builder/Cargo.toml
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $linker = (Get-Command link.exe).Source
          "LOOM_WASM_TOOLS=$($wasmTools[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOOM_WASMTIME=$($wasmtime[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOOM_COMPONENT_BUILDER=$env:GITHUB_WORKSPACE\tools\loom-component-builder\target\release\loom-component-builder.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOOM_EFFECTFUL_COMPONENT_BUILDER=$env:GITHUB_WORKSPACE\tools\loom-effectful-component-builder\target\release\loom-effectful-component-builder.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOOM_CARGO=$(rustup which --toolchain 1.93.0 cargo)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOOM_RUSTC=$(rustup which --toolchain 1.93.0 rustc)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOOM_COMPONENT_CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOOM_WINDOWS_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile Windows Component surfaces
        run: python -m py_compile loom.py loom_wasi_capabilities.py loom_component_adapter.py loom_component_release.py tools/windows_component_conformance.py
      - name: Run Windows Component Conformance v0
        env:
          LOOM_WINDOWS_RUNNER: windows-2025
        run: python tools/windows_component_conformance.py --output .windows-component-witness/x86_64-pc-windows-msvc.json
      - name: Upload Windows Component witness
        uses: actions/upload-artifact@v4
        with:
          name: windows-component-conformance-v0
          path: .windows-component-witness/x86_64-pc-windows-msvc.json
          if-no-files-found: error

  verify-windows-host-security:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Pin the native x64 compiler
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe).Source
          "LOOM_WINDOWS_CL=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile Windows Host Security surfaces
        run: python -m py_compile loom_windows_host.py tools/windows_host_security_conformance.py
      - name: Run Windows Host Security Substrate v0
        env:
          LOOM_WINDOWS_RUNNER: windows-2025
        run: python tools/windows_host_security_conformance.py --output .windows-host-security-witness/x86_64-pc-windows-msvc.json
      - name: Upload Windows Host Security witness
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-security-substrate-v0
          path: .windows-host-security-witness/x86_64-pc-windows-msvc.json
          if-no-files-found: error

  verify-windows-bounded-execution:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Pin the native x64 compiler
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe).Source
          "LOOM_WINDOWS_CL=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile Windows Bounded Execution surfaces
        run: python -m py_compile loom.py loom_windows_host.py loom_windows_execution.py tools/windows_bounded_execution_conformance.py
      - name: Run Windows Bounded Execution Integration v0
        env:
          LOOM_WINDOWS_RUNNER: windows-2025
        run: python tools/windows_bounded_execution_conformance.py --output .windows-bounded-execution-witness/x86_64-pc-windows-msvc.json
      - name: Upload Windows Bounded Execution witness
        uses: actions/upload-artifact@v4
        with:
          name: windows-bounded-execution-integration-v0
          path: .windows-bounded-execution-witness/x86_64-pc-windows-msvc.json
          if-no-files-found: error

  verify-windows-general-execution:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Pin the native x64 compiler
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe).Source
          "LOOM_WINDOWS_CL=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile Windows General Execution surfaces
        run: python -m py_compile loom.py loom_provenance.py loom_windows_host.py loom_windows_execution.py loom_windows_general.py tools/windows_bounded_execution_conformance.py tools/windows_general_execution_conformance.py
      - name: Run Windows General Adapter Execution v1
        env:
          LOOM_WINDOWS_RUNNER: windows-2025
        run: python tools/windows_general_execution_conformance.py --output .windows-general-execution-witness/x86_64-pc-windows-msvc.json
      - name: Upload Windows General Execution witness
        uses: actions/upload-artifact@v4
        with:
          name: windows-general-adapter-execution-v1
          path: .windows-general-execution-witness/x86_64-pc-windows-msvc.json
          if-no-files-found: error
      - name: Upload Windows General Execution federation input
        uses: actions/upload-artifact@v4
        with:
          name: general-execution-platform-windows
          path: .windows-general-execution-witness/x86_64-pc-windows-msvc.json
          if-no-files-found: error

  federate-component-evidence:
    needs: [verify, verify-macos-component]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download platform witnesses
        uses: actions/download-artifact@v4
        with:
          pattern: component-platform-*
          path: .federation-witness
          merge-multiple: true
      - name: Aggregate real macOS/Linux Component evidence
        run: python tools/verify_component_federation_ci.py .federation-witness --output .federation-result/federation.json
      - name: Upload test-only federation evidence
        uses: actions/upload-artifact@v4
        with:
          name: component-federation-v0
          path: .federation-result/federation.json
          if-no-files-found: error

  federate-general-execution-evidence:
    needs: [verify, verify-macos-component, verify-windows-general-execution]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download native general-execution witnesses
        uses: actions/download-artifact@v4
        with:
          pattern: general-execution-platform-*
          path: .general-execution-witness
          merge-multiple: true
      - name: Aggregate macOS, Linux, and Windows native evidence
        run: python tools/verify_general_execution_federation_ci.py .general-execution-witness --expected-commit "$GITHUB_SHA" --output .general-execution-federation/federation.json
      - name: Upload test-only general-execution federation
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-general-execution-federation-v0
          path: .general-execution-federation/federation.json
          if-no-files-found: error
